      kicker: "Agent anatomy review"
      title: "Agents = LLM, an inner tool loop, and an outer user loop."
      body:
        - "We just gave it the <b>right tools</b>, we taught it to read <b>agent skills</b>, and we <b>improved the models</b>." #
    image_notes:
      - "close-up schematic of the same potato agent"
      - "label each part: LLM brain, chat-bot lips and ears, agentic tool-hands, feet, and eyes"

  - slide: 13
    top_bar:
      - "a Personal story"
      - "Recognition"
      - "№13 / 26"
    story:
      kicker: "John's dawn of recognition"
      title: "In an afternoon of hacking I suddenly realized: <b>English is now the language of AI software.</b>" # just the period
      body:
        - "Just for fun, we were building a Zoom assistant. Shawn took the wheel when we started programming it, not in Python or Typescript, but in English as an agent skill. The core of the assistant could be run on Claude Code. The only thing left was a thin wrapper to connect it to the Zoom API."
        - "Then it clicked for me: <b>agents were the runtime, skills were the software, and English was the programming language.</b>" # We might want to make these bullets or a panel. Let's discuss.
    photo_labels: # We need to have a discussion about how to rearrange these image
      - "Shawn Simister"
      - "Nick"
      - "Me"
    footer: "Agents were the runtime. Skills were the software."
    image_notes:
      - "images of 'Shawn Simister', 'Nick', and 'me'"

