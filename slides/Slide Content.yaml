      cards:
        - number: "01"
          text: "What an <b>agent really is</b>. (It’s actually pretty simple.)"
        - number: "02"
          text: "Why English is now <b>the language</b> for AI software."
        - number: "03"
          text: "How to incrementally build AI products <b>that actually work</b>."
    footer: "What · Why · How"
    image_notes: []

  # NOTE: slides 3-5 are logically a single slide, we need to address this.
  - slide: 3
    top_bar:
      - "2023 anatomy"
      - "Sequence 1/3"
      - "№3 / 26"
    concept:
      kicker: "What an AI agent was in 2023"
      title: "In the beginning was the LLM. <b>Text in -> text out.</b>" # is there any way you could fit this on one line
    footer: "Introducing our potato-y hero"
    image_notes:
      - "picture of a computer-brain thing stuck in a potato-y body that has no eyes, mouth, ears, arms, or legs"
      - "the brain sticks out of the top of the potato, as if the top of its cranium has been removed, but not in a gross way"

  - slide: 4
    top_bar:
      - "2023 anatomy"
      - "Sequence 2/3"
      - "№4 / 26"
    concept:
      kicker: "Add an outer loop"
      title: "Wrap it in a while loop with user input. <b>Now, it's a chat bot.</b>"
    footer: "our hero finds its voice"
    image_notes:
      - "the potato-like agent body gains a smiling mouth, ears, and legs"
      - "it still has no eyes or arms"

  - slide: 5
    top_bar:
      - "2023 anatomy"
      - "Sequence 3/3"
      - "№5 / 26"
    concept:
      kicker: "Add an inner loop"
      title: "Add another loop for tools. <b>Now it's an agent.</b>"
      body:
        - "It can see the world through APIs and act on the world through APIs."
    footer: "The only real difference is the loops and the tools"
    image_notes:
      - "same potato-y agent, but add eyeballs"
      - "give it hands with wrenches and a toolbelt"

  - slide: 6
    top_bar:
      - "Problem"
      - "Technical framing"
      - "№6 / 26"
    headline:
      kicker: "BUT 2023 AGENTS ACTUALLY SUCKED"
      title: "They were terrible at following instructions."
    panels:
      - heading: "Here was the problem"
        bullets:
          - "they would start on the right track"
          - "then get distracted by their own tool output"
          - "or get distracted by examples in the context"
          - "and soon start solving some other problem"
      - heading: "What we did instead"
        bullets:
          - "constrain the workflow with explicit state machines"
          - "force the processing steps to happen in a fixed order"
          - "use things like LangGraph to keep the model on rails"
    footer: "Technical problem: not enough long-horizon reliability"
    image_notes:
      - "if we add imagery later, use an illustration of the agent wandering off-task"
      - "optionally gesture toward state-machine / LangGraph-style control rails"

  # NOTE - slides 7 through 11 are supposed to be a single logical slide - we need to talk about this in detail soon
  - slide: 7
    top_bar:
      - "Transition"
      - "Harnesses"
      - "№7 / 26"
    transition:
      kicker: "... but nevertheless"
      title: "Agents lived on in <b>coding harnesses</b>, and improved significantly."
    footer: "This is where agents got practically useful"
    image_notes:
      - "transition slide; no required image from the outline"

  - slide: 8
    top_bar:
      - "Harness era"
      - "Sequence 1/4"
      - "№8 / 26"
    idea:
      kicker: "Read · Write · Shell"
      title: "Coding agents became <b>general agents</b>."
      body:
        - "Because once an agent can read and write files, and run shell commands, it can then build its own tools and in principle accomplish nearly any online activity."
    footer: "Read, write, and shell changed the game."
    image_notes:
      - "same potato agent from before"
      - "replace the tools with a computer the potato is using"
      - "give it a general's hat, like a revolutionary general"

  - slide: 9
    top_bar:
      - "Harness era"
      - "Sequence 2/4"
      - "№9 / 26"
    idea:
      kicker: "Skills"
      title: "Skills are basically an <b>onboarding manual</b>."
      body:
        - "Once agents became good at files and OS interactions, agent skills were a spectacularly good idea."
    side_card:
      heading: "Manual"
      title: "Skillz"
      detail: "task definition · ordered steps · output rules"
    footer: "The procedure becomes data the agent can read"
    image_notes:
      - "same potato agent from slide 8"
      - "place a thick instruction manual labeled Skillz next to it"

  - slide: 10
    top_bar:
      - "Late 2025"
      - "Capability shift"
      - "№10 / 26"
    headline:
      kicker: "late-2025 capability step change"
      title: "Coding models got much better at <b>long-horizon work</b> in late 2025."
    panels:
      - heading: "What changed"
        bullets:
          - "stayed on target longer"
          - "handled ambiguity with less hand-holding"
          - "made fewer dead-end tool decisions"
          - "became much more practical for coding + agent workflows"
      - heading: "Late-2025 references"
        items:
          - "Simon Willison — <b>2025: The year in LLMs</b>"
          - "Andrej Karpathy — <b>2025 LLM Year in Review</b>"
          - "Anthropic — <b>Claude Opus 4.5</b>"
    footer: "The Christmas miracle of 2025"
    image_notes:
      - "mostly text-forward slide"
      - "if any image treatment is added, it should support the idea of a late-2025 capability jump"

  - slide: 11
    top_bar:
      - "Consequence"
      - "Sequence 4/4"
      - "№11 / 26"
    payoff:
      kicker: "The payoff"
      title: "You don’t need bespoke state machine workflows. <b>Just place the instructions in the agent skill.</b>"
    footer: "This is the turning point"
    image_notes:
      - "final roundup message slide; no extra image required by the outline"

  - slide: 12
    top_bar:
