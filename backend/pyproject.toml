[project]
name = "hireflow-backend"
version = "0.3.0"
description = "AI-assisted candidate screening API built with FastAPI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic-settings>=2.10.1",
    "sqlalchemy[asyncio]>=2.0.43",
    "aiosqlite>=0.21.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-ai>=1.77.0",
    "pydantic-ai-skills>=0.6.0",
    "logfire>=4.31.0",
    "pydantic-ai-slim[duckduckgo,web-fetch]>=1.77.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
