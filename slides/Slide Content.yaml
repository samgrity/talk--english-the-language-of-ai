  - slide: 6
    top_bar:
      - "Problem"
      - "Technical framing"
      - "№6 / 26"
    headline:
      kicker: "BUT 2023 AGENTS ACTUALLY SUCKED"
      title: "They were terrible at following instructions."
    panels:
      - heading: "Here was the problem"
        bullets:
          - "they would start on the right track"
          - "then get distracted by their own tool output"
          - "or get distracted by examples in the context"
          - "and soon start solving some other problem"
      - heading: "What we did instead"
        bullets:
          - "constrain the workflow with explicit state machines"
          - "force the processing steps to happen in a fixed order"
          - "use things like LangGraph to keep the model on rails"
    footer: "Technical problem: not enough long-horizon reliability"
    image_notes:
      - "if we add imagery later, use an illustration of the agent wandering off-task"
      - "optionally gesture toward state-machine / LangGraph-style control rails"

  # NOTE - slides 7 through 11 are currently the same logical slide with progressive bullet reveal and different right-side treatments.
  - slide: 7
    top_bar:
      - "Harness era"
      - "Overview"
      - "№7 / 24"
    harness_overview:
      kicker: "... but nevertheless"
      title: "Agents lived on in <b>coding harnesses</b>, and improved significantly."
      bullets:
        - "We gave them `read`, `write`, `edit`, and `shell` tools. They could write their own scripts. <b>This made them _general_ agents.</b>"
        - 'When you get good at reading from the file system, agent skills become an obvious way to capture repeated instructions. <b>Skills are basically an onboarding manual for your agent "intern".</b>'
        - "Then in late 2025 <b>coding agents suddenly became much better at long-horizon work.</b>"
      payoff: "We only rarely need bespoke state-machine workflows. <b>Just give the agent the right tools and the right agent skills.</b>"
      revealed_bullets: 0
      payoff_visible: false
    image_notes:
      - "image of the basic potato agent from a few slides back"

